<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova 7: i complementi con “di”</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--ink:#18202E;--soft:#5B6678;--card:#FFFFFF;--line:#D5DCE8;--s:#D62F2F;--g:#27914A;--o:#E8800C;--obg:#FCE9D2;--v:#7A3FB5;--vbg:#EBDDF7;--bad:#C0392B;--badbg:#FBE3E0;--okbg:#DDF2E4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--ink:#EEF1F7;--soft:#9AA6BA;--card:#1B2231;--line:#2D3750;--g:#58C57B;--o:#FFA640;--obg:#4A3519;--v:#C08BF2;--vbg:#3A2652;--bad:#FF8A7A;--badbg:#4A2420;--okbg:#1E3D2A}}
:root[data-theme="dark"]{--bg:#121722;--ink:#EEF1F7;--soft:#9AA6BA;--card:#1B2231;--line:#2D3750;--g:#58C57B;--o:#FFA640;--obg:#4A3519;--v:#C08BF2;--vbg:#3A2652;--bad:#FF8A7A;--badbg:#4A2420;--okbg:#1E3D2A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,sans-serif;font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.45}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 5vw;border-bottom:3px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.4em .9em}
header a:focus-visible,button:focus-visible,label:focus-within{outline:3px solid var(--v);outline-offset:2px}
header span{color:var(--soft)}
main{max-width:820px;margin:0 auto;padding:4vh 5vw 8vh}
h1,h2{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.4rem)}h2{font-size:clamp(1.5rem,4vw,2.2rem)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:3vh}.bar i{display:block;height:100%;background:var(--v);width:0;transition:width .3s}
.stem{font-size:clamp(1.5rem,4vw,2.4rem);font-family:"Bricolage Grotesque",Georgia,sans-serif;font-weight:800;margin:0 0 .4em}
.stem u{text-decoration-color:var(--v);text-decoration-thickness:4px;text-underline-offset:6px}
.q{color:var(--soft);margin:0 0 1.2em}
.opt{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:.8em 1em;margin-bottom:12px;cursor:pointer}
.opt input{width:1.3em;height:1.3em;accent-color:var(--v);flex:none}
.opt.sel{border-color:var(--v);background:var(--vbg)}
button.go{font:inherit;font-weight:700;background:var(--v);color:#fff;border:0;border-radius:14px;padding:.7em 1.6em;cursor:pointer;margin-top:1.2em}
button.go:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(3rem,10vw,5.5rem);line-height:1;margin:.1em 0}
.row{display:flex;align-items:center;gap:12px;margin:.5em 0}.row b{flex:0 0 11em}.row .bar{flex:1;margin:0;height:14px}
.rev{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:1em 1.2em;margin:14px 0}
.rev p{margin:.3em 0}.no{color:var(--bad);font-weight:700}.yes{color:var(--g);font-weight:700}
.note{background:var(--vbg);border-left:6px solid var(--v);border-radius:10px;padding:.8em 1em;margin:1em 0}
.hide{display:none}
</style></head><body>
<header><a href="../index.html">← Torna al menu</a><span id="cnt"></span></header>
<main>
<section id="intro">
<h1>Tanti “di”, ruoli diversi</h1>
<p>15 domande più impegnative sui complementi introdotti da “di”: specificazione, denominazione, argomento, limitazione, paragone e materia. Scegli una risposta e vai avanti: alla fine ti diremo come è andata e ti spiegheremo gli errori.</p>
<button class="go" id="start">Comincia</button>
</section>
<section id="quiz" class="hide">
<div class="bar"><i id="pb"></i></div>
<p class="stem" id="stem"></p><p class="q" id="q"></p>
<div id="opts" role="radiogroup"></div>
<button class="go" id="next" disabled>Avanti</button>
</section>
<section id="res" class="hide"></section>
</main>
<script>
const Q=[
{t:'den',s:'Abbiamo visitato la città <u>di Bologna</u>.',q:'Che complemento è la parte sottolineata?',o:['denominazione','specificazione','argomento','materia'],a:0,e:'«Città» e «Bologna» sono la stessa cosa: Bologna è il nome proprio della città. È un complemento di denominazione.'},
{t:'den',s:'Ad agosto andremo nell’isola <u>di Cipro</u>.',q:'Che complemento è la parte sottolineata?',o:['specificazione','denominazione','argomento','limitazione'],a:1,e:'Cipro è il nome dell’isola: isola = Cipro. Denominazione.'},
{t:'spe',s:'Ho dimenticato lo zaino <u>di Marco</u>.',q:'Che complemento è la parte sottolineata?',o:['denominazione','argomento','specificazione','paragone'],a:2,e:'Di chi è lo zaino? Di Marco. Zaino e Marco non sono la stessa cosa: specificazione.'},
{t:'spe',s:'Le pagine <u>del libro</u> sono bagnate.',q:'Che complemento è la parte sottolineata?',o:['materia','specificazione','denominazione','argomento'],a:1,e:'Di che cosa sono le pagine? Del libro, di cui fanno parte. Pagine e libro sono cose diverse: specificazione.'},
{t:'conf',s:'',q:'In quale frase c’è un complemento di denominazione?',o:['La capitale della Francia è Parigi.','Il mese di maggio è piovoso.','Il cappello di Anna è rosso.','Il tema della storia è la guerra.'],a:1,e:'«Mese» e «maggio» sono la stessa cosa: maggio è il nome del mese. Nelle altre frasi «di» introduce una specificazione.'},
{t:'conf',s:'Ho incontrato il sindaco <u>della città</u> <u>di Bologna</u>.',q:'Che complementi sono, nell’ordine, le parti sottolineate?',o:['specificazione e denominazione','denominazione e specificazione','argomento e denominazione','specificazione e argomento'],a:0,e:'Di che cosa è sindaco? Della città: specificazione. Città = Bologna, il suo nome: denominazione.'},
{t:'conf',s:'',q:'In quale frase «di Anna» è una specificazione?',o:['Parlo di Anna.','Sono più alto di Anna.','Questa è la bicicletta di Anna.'],a:2,e:'Di chi è la bicicletta? Di Anna: specificazione. In «parlo di Anna» è un argomento, in «più alto di Anna» è un paragone.'},
{t:'conf',s:'Il libro <u>di Marco</u> è rilegato <u>in cuoio</u> e parla <u>di Cipro</u>.',q:'Che complementi sono, nell’ordine, le tre parti sottolineate?',o:['specificazione, materia, argomento','materia, specificazione, argomento','specificazione, argomento, materia','denominazione, materia, argomento'],a:0,e:'«Di Marco»: di chi è il libro? Specificazione. «In cuoio»: fatto di che cosa? Materia. «Di Cipro»: di che cosa parla? Argomento.'},
{t:'conf',s:'Mio nonno è debole <u>di vista</u>, ma <u>di carattere</u> è più forte <u>di me</u>.',q:'Che complementi sono, nell’ordine, le tre parti sottolineate?',o:['limitazione, limitazione, paragone','argomento, limitazione, paragone','limitazione, specificazione, paragone','limitazione, limitazione, specificazione'],a:0,e:'«Di vista» e «di carattere» dicono in che cosa vale la qualità: due limitazioni. «Di me» è il secondo termine del confronto: paragone.'},
{t:'conf',s:'',q:'Quale coppia di domande distingue specificazione e denominazione?',o:['specificazione: di chi o di che cosa è? · denominazione: come si chiama?','specificazione: come si chiama? · denominazione: di chi è?','specificazione: fatto di che cosa? · denominazione: su che cosa?','specificazione: in che cosa? · denominazione: rispetto a chi?'],a:0,e:'La specificazione dice di chi o di che cosa è qualcosa; la denominazione dice come si chiama, cioè il nome proprio di ciò che è già nominato.'},
{t:'den',s:'',q:'Quale espressione supera il test dell’uguale (il nome comune e il complemento indicano la stessa cosa)?',o:['il mese di giugno','la porta di casa','il libro di storia','il cane di Marco'],a:0,e:'Mese = giugno: indicano la stessa cosa. Porta ≠ casa, libro ≠ storia, cane ≠ Marco: nelle altre c’è un altro tipo di complemento.'},
{t:'spe',s:'I turisti visitano il castello <u>di Federico II</u>.',q:'Che complemento è la parte sottolineata?',o:['denominazione','specificazione','argomento','materia'],a:1,e:'Castello e Federico II non sono la stessa cosa: Federico II non è il nome del castello, ma di chi lo ha costruito o posseduto. Specificazione.'},
{t:'conf',s:'Ho una collana <u>d’oro</u> <u>di mia madre</u>.',q:'Che complementi sono, nell’ordine, le parti sottolineate?',o:['specificazione e materia','materia e specificazione','materia e denominazione','argomento e specificazione'],a:1,e:'«D’oro»: fatta di che cosa? Materia. «Di mia madre»: di chi è la collana? Specificazione.'},
{t:'altro',s:'Nel Mediterraneo <u>esiste</u> l’isola di Cipro.',q:'Che cos’è «esiste» in questa frase?',o:['predicato verbale (vuol dire «c’è»)','copula','predicato nominale','nome del predicato'],a:0,e:'«Esistere» ha un significato proprio ed è predicato verbale. «Di Cipro» è la denominazione di «isola».'},
{t:'altro',s:'Il tavolo di legno <u>è più pesante</u> della sedia.',q:'Che cos’è «è più pesante»?',o:['predicato verbale','predicato nominale (copula + nome del predicato)','complemento predicativo del soggetto','complemento di paragone'],a:1,e:'C’è il verbo essere: «è» è la copula e «più pesante» il nome del predicato. «Di legno» è la materia, «della sedia» il paragone.'}
];
const AREA={den:['Denominazione','var(--o)'],spe:['Specificazione','var(--o)'],conf:['“Di” a confronto','var(--v)'],altro:['Analisi del predicato','var(--p,#1F5FD1)']};
let i=0,ans=[],ord=[];
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function show(id){['intro','quiz','res'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function render(){
 const d=Q[i];$('stem').innerHTML=d.s||d.q;$('q').textContent=d.s?d.q:'';$('cnt').textContent='Domanda '+(i+1)+' di '+Q.length;
 $('pb').style.width=(i/Q.length*100)+'%';
 ord[i]=ord[i]||shuffle(d.o.map((t,k)=>k));
 $('opts').innerHTML='';
 ord[i].forEach(k=>{const l=document.createElement('label');l.className='opt';l.innerHTML='<input type="radio" name="r"><span></span>';l.querySelector('span').textContent=d.o[k];
  l.querySelector('input').onchange=()=>{ans[i]=k;[...$('opts').children].forEach(c=>c.classList.remove('sel'));l.classList.add('sel');$('next').disabled=false};
  $('opts').appendChild(l)});
 $('next').disabled=true;$('next').textContent=i==Q.length-1?'Vedi il risultato':'Avanti';
}
$('start').onclick=()=>{i=0;ans=[];ord=[];show('quiz');render()};
$('next').onclick=()=>{if(i<Q.length-1){i++;render()}else result()};
function result(){
 show('res');$('cnt').textContent='Risultato';
 const ok=Q.map((d,k)=>ans[k]===d.a),n=ok.filter(Boolean).length;
 const by={};Q.forEach((d,k)=>{by[d.t]=by[d.t]||[0,0];by[d.t][1]++;if(ok[k])by[d.t][0]++});
 let msg=n>=11?'Ottimo! Distingui bene il fumetto dalla cornice.':n>=8?'Bene! Hai capito l’idea: ripassa gli errori qui sotto e sarai sicuro.':n>=5?'Sei a metà strada: rivedi le slide e riprova la prova.':'Per ora fai ancora confusione: rivedi le slide con calma e poi riprova.';
 let h='<h1>Come è andata</h1><p class="score">'+n+' / '+Q.length+'</p><p>'+msg+'</p><h2>Per tipo di domanda</h2>';
 Object.keys(by).forEach(t=>{const [a,b]=by[t];h+='<div class="row"><b>'+AREA[t][0]+'</b><div class="bar"><i style="width:'+(a/b*100)+'%;background:'+AREA[t][1]+'"></i></div><span>'+a+'/'+b+'</span></div>'});
 const wr=Q.map((d,k)=>k).filter(k=>!ok[k]);
 if(wr.length){
  h+='<div class="note"><b>Consiglio.</b> ';
  const nd=wr.filter(k=>Q[k].t=='den').length,ns=wr.filter(k=>Q[k].t=='spe').length,nc=wr.filter(k=>Q[k].t=='conf').length;
  h+=nd>ns&&nd>=nc?'Ripassa la denominazione: usa il test dell’uguale (mese = giugno, città = Bologna) e chiediti <i>come si chiama?</i>':ns>nd&&ns>=nc?'Ripassa la specificazione: chiediti <i>di chi o di che cosa è?</i> e controlla che i due nomi non siano la stessa cosa.':'Quando vedi «di», non fermarti alla preposizione: fai le domande. Di chi è? (specificazione) · Come si chiama? (denominazione) · Di che cosa si parla? (argomento) · In che cosa? (limitazione) · Rispetto a chi? (paragone) · Fatto di che cosa? (materia).';
  h+='</div><h2>Rivediamo gli errori</h2>';
  wr.forEach(k=>{const d=Q[k];h+='<div class="rev"><p><b>'+(d.s||d.q)+'</b></p>'+(d.s?'<p>'+d.q+'</p>':'')+'<p class="no">La tua risposta: '+d.o[ans[k]]+'</p><p class="yes">Risposta giusta: '+d.o[d.a]+'</p><p>'+d.e+'</p></div>'});
 }else h+='<div class="note">Nessun errore: complimenti!</div>';
 h+='<button class="go" id="again">Rifai la prova</button> <a class="go alt" href="../index.html" style="display:inline-block;text-decoration:none;font-weight:700;border-radius:14px;padding:.7em 1.6em;margin-left:8px">Torna al menu</a>';
 $('res').innerHTML=h;$('again').onclick=()=>{i=0;ans=[];ord=[];show('quiz');render()};scrollTo(0,0);
}
</script></body></html>
